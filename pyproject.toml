[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "void-ai"
version = "0.1.0"
description = "V.O.I.D. — Virtual Operator of Information & Development: Autonomous Local Multi-Agent AI Operating Layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "VoidRanger-47" }
]
keywords = [
    "local-ai",
    "multi-agent-systems",
    "autonomous-agents",
    "offline-ai",
    "computer-vision",
    "voice-assistant",
    "python",
    "yolov8",
    "developer-tools",
    "pytorch"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
